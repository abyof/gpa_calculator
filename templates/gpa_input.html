<!DOCTYPE html>
<html>
<head>
    <title>Student_info_page</title>
    <meta charset="UTF-8"> 
    <link rel="stylesheet" href="{{url_for('static', filename='css/gpa.css')}}">
</head>
<body>
    <hr>
    <h1>GPA CALCULATOR</h1>
    <p class="intro">
        Calculate your GPA or CGPA instantly with precision. This streamlined tool is designed to eliminate manual math
        mistakes, giving you accurate results within seconds so you can stay on top of your academic goals.
    </p>
    <div class="gpa-card">
        <div class="profile">
            <form action="/info" method="POST">
                <table>
                    <thead>
                        <tr>
                            <th>Subjects</th>
                            <th>Credits</th>
                            <th>Grades</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr>
                            <td><input type="text" name="subject"></td>
                            <td><input type="number" name="credit_hour" class="cr-input"></td>
                            <td>
                                <select name="grade" id="grade" class="grd-input">
                                    <option>-</option>
                                    <option value="A+">A+</option>
                                    <option value="A">A</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B">B</option>
                                    <option value="B-">B-</option>
                                    <option value="C+">C+</option>
                                    <option value="C">C</option>
                                    <option value="C-">C-</option>
                                    <option value="D">D</option>
                                    <option value="F">F</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><input type="text" name="subject"></td>
                            <td><input type="number" name="credit_hour" class="cr-input"></td>
                            <td>
            
                                <select name="grade" id="grade" class="grd-input">
                                    <option>-</option>
                                    <option value="A+">A+</option>
                                    <option value="A">A</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B">B</option>
                                    <option value="B-">B-</option>
                                    <option value="C+">C+</option>
                                    <option value="C">C</option>
                                    <option value="C-">C-</option>
                                    <option value="D">D</option>
                                    <option value="F">F</option>
                                </select>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <button type="submit" class="calc-btn">Calculate_Gpa</button>
                <button type="button" id="add" class="add-btn">Add_row</button>
                <script src="{{url_for('static', filename= 'script/gpa_script.js')}}" defer></script>
            </form>
        </div>
    </div> 
    
</body>
</html>
