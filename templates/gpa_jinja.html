<!DOCTYPE html>
<html>
<head>
    <title>Gpa_display_page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{url_for('static', filename='css/gpa_view.css')}}">
</head>
<body>
    <div class="show">
        <div><h2>Result</h2></div>
        <table>
            <tr>
                <th class="head">Subjects</th>
                <th class="head">Credit_hours</th>
                <th class="head">Grades</th>
            </tr>
            {% for subject in subjects %}
            <tr>
                <td>
                    <p class="sub">{{subject}}</p>
                </td>
                <td>
                    <p class="cr">{{credits[loop.index0]}}</p>
                </td>
                <td>
                    <p class="gr">{{grades[loop.index0]}}</p>
                </td>
            </tr>
            {% endfor %}
        </table>
        <div class="gpa">
            <ul>
                <li>
                    <h3>Total_credits: {{total_credits}}</h3>
                </li>
                <li>
                    <h3>Total_sum: {{total_sum}}</h3>
                </li>
                <li>
                    <h3>Final_gpa: {{final_gpa}}</h3>
                </li>
                <li>
                    <h3>Comment: {{comment}}</h3>
                </li>
            </ul>
            
        </div>
        <button type="button" class="back-btn" onclick="history.back()">Go back</button>
    </div>
</body>

</html>
